<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script>
      // Redirect to the root and add the path as a hash
      const path = window.location.pathname.substring(1);
      window.location.href = "/" + (path ? "#/" + path : "");
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
